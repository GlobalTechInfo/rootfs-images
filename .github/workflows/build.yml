name: "Build and publish rootfs"

on:
  push:
    branches:
      - main
    paths:
      - 'distro-build/**'
      - 'scripts/**'
      - 'bootstrap-rootfs.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'distro-build/**'
      - 'scripts/**'
      - 'bootstrap-rootfs.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      distributions:
        description: 'Space-separated distributions to build (default: all)'
        required: false
      tag:
        description: 'Release tag to publish under (default: latest git tag)'
        required: false

permissions:
  # Needed to create the release and attach assets to it. A pull_request build gets
  # the same permissions from the fork's token, which is read-only, so the publish step
  # is additionally guarded on the event name below.
  contents: write

concurrency:
  # Queued, not cancelled. These runs take hours and publish a release, so
  # cancel-in-progress throws away the finished work of a run that is most of the
  # way through: a run that had rebuilt fifteen of nineteen recipes was killed at
  # the sixteenth by an unrelated one-line commit pushed three minutes later.
  #
  # The usual reason to cancel is that the later commit supersedes the earlier one.
  # That does not hold here. A superseding push means the *recipes* to build
  # changed; it does not mean the images already built are wrong, and they are
  # published under a fixed tag that they do not vanish from. Let the earlier run
  # finish and let the later one replace what it needs to.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # bootstrap-rootfs.sh derives the release version from the latest tag, so the
          # tags have to be present. A shallow clone reports no tags at all, CURRENT_VERSION
          # comes out empty, and every recipe refuses with "Cannot detect a release
          # version" -- which is a green run that built nothing.
          fetch-depth: 0

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          tag='${{ github.event.inputs.tag }}'
          if [ -z "$tag" ]; then
            tag=$(git tag --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::No git tag found and no 'tag' input was given."
            echo "::error::Pass one via the workflow_dispatch 'tag' input, or push a tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Exported so bootstrap-rootfs.sh and generate-index.sh agree with the tag the
          # assets are published under. Deriving it twice from the same source is how a
          # build ends up stamped one version and published under another.
          echo "ROOTFS_VERSION=$tag" >> "$GITHUB_ENV"
          echo "Building for $tag"

      - name: Decide which distributions to build
        run: |
          set -euo pipefail
          # Deliberately not piped through `tee .build/...`. tee opens its output file
          # when the pipeline starts, which is before the script has run its own
          # `mkdir -p .build`, so tee fails on a missing directory and pipefail turns
          # that into exit 1 with the full recipe list printed just above it -- which
          # reads like a recipe was rejected. The script already writes .build/list.txt
          # and echoes the list to stdout, so the tee bought nothing.
          ./scripts/select-distributions.sh \
            --event "${{ github.event_name }}" \
            --base "origin/${{ github.base_ref }}" \
            --input "${{ github.event.inputs.distributions }}"
          echo "Building: $(tr '\n' ' ' < .build/list.txt)"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl jq sudo tar xz-utils binfmt-support qemu-user-static \
            skopeo debootstrap arch-test
          # Needed by the Debian-family recipes. Installed from the archive rather
          # than apt because the version upstream pins is no longer current.
          curl -fsSL -o /tmp/mmdebstrap.deb \
            http://ftp.us.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.5.7-3_all.deb
          sudo dpkg -i /tmp/mmdebstrap.deb

          # mmdebstrap is the one recipe that has to *run* target-architecture code:
          # it executes maintainer scripts inside the target chroot. On an x86_64
          # runner the aarch64 and arm images are foreign, so without qemu registered
          # it refuses outright --
          #
          #   E: install arch-test for foreign architecture support
          #
          # which names debian.sh and nothing else. Installing qemu-user-static is not
          # enough on its own: the handlers exist but are not enabled, so the
          # executables are not reachable through binfmt_misc.
          #
          # This went unnoticed because the machine this was developed on is arm64 and
          # already had both arch-test and its handlers registered, so it cross-built
          # the other direction and never hit the condition.
          sudo update-binfmts --enable
          echo "Registered handlers:"
          sudo ls /proc/sys/fs/binfmt_misc/ | grep -E 'qemu-(aarch64|arm)$'

      # Taken before the build, not inside the publish step.
      #
      # The publish step needs the published index to merge into, but it is skipped on
      # a pull request, and the verdict step below compares before against after and so
      # needs the "before" whatever happens. Downloading it here means it is genuinely
      # a snapshot of the release as it stood when this run started, rather than
      # whatever it became while the build was running.
      - name: Snapshot the published index
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -uo pipefail
          rm -rf .build/published
          mkdir -p .build/published
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern 'index.json' --dir .build/published \
              --clobber 2>/dev/null \
              || echo "No published index yet; this run defines it."
          else
            echo "No release for $TAG yet; this run defines it."
          fi
          if [ -s .build/published/index.json ]; then
            echo "Release $TAG currently carries $(python3 -c '
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(len(d["images"] if isinstance(d,dict) else d))' .build/published/index.json) images."
          fi

      - name: Build
        run: |
          set -uo pipefail

          # Decided here, not in a step-level `if:`. hashFiles() is evaluated when the
          # job starts, before any step has run, so .build/list.txt does not exist yet
          # and any guard written against it is always false -- which silently skipped
          # the build entirely and then reported "no images were produced", naming a
          # recipe problem for what was a condition on the wrong expression.
          if [ ! -s .build/list.txt ]; then
            echo "No recipes selected; nothing to build."
            exit 0
          fi
          # Each recipe is run separately, and a failure is recorded rather than
          # allowed to end the run.
          #
          # Recipes are built in filename order, so a source that is unreachable
          # fails at or near the start and takes everything after it with it. Adelie
          # alone has cost every run so far at the first recipe, while nineteen other
          # distributions that build perfectly were never attempted. One bad source
          # must not be able to decide the fate of the whole release.
          #
          # The run still ends in failure if anything failed, and names what. It just
          # publishes the recipes that worked first, so a broken mirror costs one
          # distribution rather than all of them.
          failed=""
          while read -r recipe; do
            [ -z "$recipe" ] && continue
            echo "::group::Building $recipe"
            # </dev/null is load-bearing, not hygiene. This loop reads the recipe
            # list from .build/list.txt, and the recipe inherits that same stdin.
            # Any recipe that prompts -- Chimera's `apk upgrade` asks "Do you want
            # to continue [Y/n]?" -- consumes the rest of the list as its answer.
            # It ate the first byte of the next line, so "debian" arrived as "ebian"
            # and was rejected as a recipe that does not exist. The failure was
            # reported against a recipe nobody had broken.
            if ./bootstrap-rootfs.sh "$recipe" < /dev/null; then
              echo "::endgroup::"
              echo "OK $recipe"
            else
              echo "::endgroup::"
              echo "FAILED $recipe"
              failed="${failed}${recipe} "
            fi
          done < .build/list.txt

          if [ -n "$failed" ]; then
            echo "::error::These recipes failed: ${failed}"
            echo "Building the ones that succeeded so their images are published."
            echo "FAILED_RECIPES=${failed}" >> "$GITHUB_ENV"
          fi

          # Not an exit. Producing no new tarball is a statement about this build, not
          # about the release: merge-index.py carries forward everything the release
          # already had, and the verdict step below is what decides whether anything
          # was actually lost.
          #
          # This used to exit 1, which meant a run that selected only a recipe whose
          # upstream was down failed here -- before the verdict step ever ran, so the
          # check that could have made the right call never got to make it. The verdict
          # still fails the run when there is genuinely nothing to publish: it needs
          # both indexes, and exits 1 if either is missing.
          if [ -z "$(ls -1 rootfs/*.tar.xz 2>/dev/null)" ]; then
            echo "::warning::This build produced no new images; the release keeps what it had."
          fi

      - name: Generate index
        run: |
          set -euo pipefail
          # Skipped when the build produced nothing: a CI-only change selects no
          # recipes, and this has nothing to index.
          if [ -z "$(ls -1 rootfs/*.tar.xz 2>/dev/null)" ]; then
            echo "No images were built; nothing to do."
            exit 0
          fi
          ./scripts/generate-index.sh "${{ steps.ver.outputs.tag }}"

      - name: Publish to the release
        # A pull request builds and verifies but publishes nothing.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$(ls -1 rootfs/*.tar.xz 2>/dev/null)" ]; then
            echo "No images were built; nothing to publish."
            exit 0
          fi

          # The tag is a fixed name that images are renewed under, so the release
          # exists on every run after the first.
          #
          # Assets are replaced one at a time (--clobber deletes and re-uploads each
          # same-named file) and everything else is left alone.
          #
          # Deleting the release and recreating it was here, and it destroyed the
          # catalogue. Builds are incremental, so a run only produces the recipes it
          # selected; recreate-the-whole-release therefore means each run keeps only
          # what it happened to rebuild. A run that built pardus, parrot and trisquel
          # published those and deleted chimera, which had been there working since
          # the day before. Users lose distributions that were available, and the
          # index agrees with the loss, so nothing reports it as missing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing only the assets this build produced."
            rm -rf .build/published
            mkdir -p .build/published
            gh release download "$TAG" --pattern 'index.json' --dir .build/published \
              --clobber 2>/dev/null || echo "No published index yet; this run defines it."
          else
            echo "No release for $TAG yet; creating it."
            gh release create "$TAG" --title "Rootfs $TAG" --generate-notes
          fi

          # An incremental run can only see the images it just built, so on its own it
          # would publish an index listing three distributions and hide the rest.
          if [ -f .build/published/index.json ]; then
            python3 scripts/merge-index.py .build/published/index.json images/index.json
          fi

          # Now take sha256 and size from the release itself.
          #
          # Everything above describes the assets from outside: generate-index.sh hashes
          # a local tarball, merge-index.py carries that number forward, and the release
          # is uploaded separately. Three places that can disagree, and they did --
          # 56 of 63 entries were wrong, every published asset smaller than its index
          # claimed. That is not a cosmetic drift: the app checks every download
          # against the index and refused every install of every affected distribution,
          # reporting a corrupt download of a file that was perfectly good.
          #
          # `gh api` returns a digest for each uploaded asset, so this is not a second
          # record to keep in step -- it is the sha256 of the bytes the release holds.
          # The index stops asserting anything the build happened to observe, and
          # cannot describe a release that does not exist.
          python3 scripts/sync-index-from-release.py --index images/index.json --tag "$TAG"

          # Unmatched globs stay literal under bash, so a recipe that produced nothing
          # makes gh name a file that does not exist and the upload fails, rather than
          # a release quietly missing images.
          gh release upload "$TAG" images/index.json --clobber
          # Images only. The distro-plugins/*.sh were uploaded because
          # proot-distro's releases carry them and the layout was copied wholesale.
          # Nothing in RedTerm reads them: ProotLaunch.kt and DistroSetup.kt
          # generate launch.sh in Kotlin, and the app never downloads a plugin. They
          # are only meaningful to someone running these images with upstream
          # proot-distro, which is not what this repository publishes for.
          #
          # index.json is the exception and stays: RedTermCatalog fetches it from the
          # release URL at runtime, and it is how the app learns which images exist.
          gh release upload "$TAG" rootfs/*.tar.xz --clobber

          echo "Release $TAG now carries $(gh release view "$TAG" --json assets --jq '.assets | length') assets"

          echo "Published $(gh release view "$TAG" --json assets --jq '.assets | length') assets to $TAG"
      - name: Report incomplete release
        # Last, and with always(), because the point is to publish what succeeded
        # first and only then decide the verdict. Placed before the publish it would
        # exit 1 and skip every remaining step, which is the exact outcome the
        # per-recipe loop exists to avoid.
        #
        # The verdict is whether the release LOST coverage, not whether every recipe
        # ran. Those are different questions and only one of them is about this
        # project.
        #
        # armtixlinux.org stopped answering entirely -- connection refused on 443 and
        # 80, bare host and www, DNS resolving to 45.67.58.27 -- and that turned every
        # run red while the release itself stayed complete and correct, because
        # merge-index.py carries every entry the build did not produce forward from the
        # published index. A green pipeline is supposed to mean "the catalogue is
        # intact and the things that could be rebuilt were". A dead third-party mirror
        # is none of those.
        #
        # So: a recipe that fails but leaves its previously published asset in place is
        # a warning, and a run that drops a distribution from the index is a failure.
        # The second is the one that matters -- recreate-the-release did exactly that
        # once and deleted twenty distributions while reporting success -- so it is
        # what this step is actually guarding.
        # Not on a pull request: nothing is published there, so nothing can be lost,
        # and the merge that restores coverage happens in the publish step, which a
        # pull request skips. Comparing a pull request's local index against the
        # published one would report every distribution it did not rebuild as lost.
        if: always() && env.FAILED_RECIPES != '' && github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          echo "::warning::These recipes failed to build: ${FAILED_RECIPES}"

          # The index as it was before this run started, and the one now published.
          before=.build/published/index.json
          after=images/index.json

          if [ ! -s "$before" ] || [ ! -s "$after" ]; then
            echo "::error::No index to compare against; treating the release as incomplete."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys

          def entries(path):
              with open(path) as fh:
                  data = json.load(fh)
              images = data["images"] if isinstance(data, dict) else data
              return {(i["distro"], i["arch"]) for i in images}

          before = entries(".build/published/index.json")
          after = entries("images/index.json")

          lost = sorted(before - after)
          if lost:
              print("::error::This run dropped %d distribution(s) from the release:" % len(lost))
              for distro, arch in lost:
                  print("::error::  lost %s/%s" % (distro, arch))
              sys.exit(1)

          print("::warning::No distribution was lost: %d entries before, %d after."
                % (len(before), len(after)))
          sys.exit(0)
          PY

          echo "The release kept every distribution it had. See the warnings above for"
          echo "which recipes could not be rebuilt, and why."
